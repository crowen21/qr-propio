{% extends "acceso.html" %}
{% block formulario %}
<h1>Clave nueva</h1>
<form method="post" action="/restablecer">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="token" value="{{ token }}">
  <label for="password">Clave nueva (mínimo 10 caracteres)</label>
  <input id="password" name="password" type="password" required minlength="10" maxlength="200" autocomplete="new-password">
  <div class="fila"><button>Guardar clave</button></div>
</form>
{% endblock %}
